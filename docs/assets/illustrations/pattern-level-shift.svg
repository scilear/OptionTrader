  <line x1="60" y1="250" x2="920" y2="250" stroke="#888" stroke-width="1"/>
  <line x1="60" y1="40" x2="60" y2="250" stroke="#888" stroke-width="1"/>
  <polyline fill="none" stroke="#c7432b" stroke-width="4" points="80,205 150,203 220,206 290,204 360,205 430,130 500,128 570,130 640,129 710,127 780,128 850,129 900,130"/>
