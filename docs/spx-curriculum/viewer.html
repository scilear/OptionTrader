<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPX Curriculum Viewer</title>
  <style>
    :root {
      --bg: #f6f7f3;
      --panel: #ffffff;
      --text: #1f2430;
      --muted: #5e6777;
      --accent: #0f5ba8;
      --border: #d6ddea;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 20% 0%, #eaf2fb 0%, #f6f7f3 42%);
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }
    .top {
      background: linear-gradient(125deg, #0f5ba8, #247f96);
      color: #fff;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .top h1 {
      margin: 0 0 5px;
      font-size: 24px;
    }
    .top a {
      color: #fff;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    #content h1, #content h2, #content h3 {
      line-height: 1.3;
      margin-top: 1.1em;
    }
    #content p, #content li {
      line-height: 1.55;
    }
    #content code {
      background: #f0f4f9;
      padding: 1px 4px;
      border-radius: 4px;
    }
    #content pre {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      overflow: auto;
    }
    .muted {
      color: var(--muted);
      font-size: 14px;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
      margin-right: 10px;
      font-size: 14px;
    }
    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>SPX Curriculum Module Viewer</h1>
      <div class="links">
        <a href="../spx-combo-trading-curriculum.html">Curriculum overview</a>
        <a href="README.md">Module index (markdown)</a>
      </div>
    </div>
    <div class="panel">
      <p id="meta" class="muted">Loading module...</p>
      <article id="content"></article>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file") || "01-market-foundations.md";
    const allowed = /^[0-9]{2}-[a-z0-9-]+\.md$/;
    const meta = document.getElementById("meta");
    const content = document.getElementById("content");

    if (!allowed.test(file)) {
      meta.textContent = "Invalid module path.";
      throw new Error("Invalid module path");
    }

    meta.textContent = `Module source: ${file}`;

    function renderFallback(markdownText) {
      const pre = document.createElement("pre");
      pre.textContent = markdownText;
      content.innerHTML = "";
      content.appendChild(pre);
      const warn = document.createElement("p");
      warn.className = "muted";
      warn.textContent = "Markdown renderer unavailable; showing raw markdown.";
      content.prepend(warn);
    }

    fetch(file)
      .then((r) => {
        if (!r.ok) {
          throw new Error(`Failed to fetch ${file}`);
        }
        return r.text();
      })
      .then((md) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
        script.onload = () => {
          if (window.marked && typeof window.marked.parse === "function") {
            content.innerHTML = window.marked.parse(md);
          } else {
            renderFallback(md);
          }
        };
        script.onerror = () => renderFallback(md);
        document.head.appendChild(script);
      })
      .catch((err) => {
        meta.textContent = err.message;
      });
  </script>
</body>
</html>
