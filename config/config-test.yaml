# Test configuration (seeded DB)

logging:
  level: INFO
  file: logs/optiontrader.log

data:
  underlying: SPX
  symbol: "^SPX"
  dte_min: 14
  dte_max: 60
  source: yfinance  # test config always uses yfinance; no IB needed for seeded DB
  capture_all_expiries: true

ib:
  hosts: []  # empty = skip IB, go straight to yfinance
  port: 7496
  client_id: 10
  timeout_seconds: 10
  strike_pct_range: 0.25

storage:
  path: data/test_optiontrader.duckdb

pricing:
  rate: 0.0
  dividend_yield: 0.0

metrics:
  delta_points: [0.10, 0.25, 0.50]
  zscore_window_days: 60
  expiry_buckets_days: [21, 30, 45]

quality:
  spread_gate_pct: 0.15
  allow_zero_bid: false
  min_valid_points_full: 5
  min_valid_points_core: 3

alerts:
  policy_variant: v1
  z_threshold: 2.0
  persistence_snapshots: 2
  pessimistic_gate: true
  regime_overrides:
    Transition:
      RR_EXTREME:
        min_abs_zscore: 6.0
      FLY_EXTREME:
        min_abs_zscore: 6.0
    Calm:
      RR_EXTREME:
        min_abs_zscore: 5.0
      FLY_EXTREME:
        min_abs_zscore: 5.0
    Stress:
      RR_EXTREME:
        min_abs_zscore: 5.0
      FLY_EXTREME:
        min_abs_zscore: 5.0
  policy_variants:
    v2a:
      regime_overrides:
        Transition:
          RR_EXTREME:
            min_abs_zscore: 6.5
          FLY_EXTREME:
            min_abs_zscore: 6.5
        Calm:
          RR_EXTREME:
            min_abs_zscore: 5.0
          FLY_EXTREME:
            min_abs_zscore: 5.0
        Stress:
          RR_EXTREME:
            min_abs_zscore: 5.0
          FLY_EXTREME:
            min_abs_zscore: 5.0
    v2b:
      regime_overrides:
        Transition:
          RR_EXTREME:
            min_abs_zscore: 999.0
          FLY_EXTREME:
            min_abs_zscore: 999.0
          disabled_alert_types: [RR_EXTREME, FLY_EXTREME]
        Calm:
          RR_EXTREME:
            min_abs_zscore: 5.0
          FLY_EXTREME:
            min_abs_zscore: 5.0
        Stress:
          RR_EXTREME:
            min_abs_zscore: 5.0
          FLY_EXTREME:
            min_abs_zscore: 5.0
  history_scope: global
  metric_series_qc_only: true
  emit_non_execution_states: false
  lifecycle:
    min_fit_confidence_validated: 0.55
    min_fit_confidence_execution: 0.70
    require_full_tier_for_execution: false

qc:
  no_arb_epsilon: 0.005
  no_arb_epsilon_iv: 0.005
  no_arb_epsilon_var: 0.005

regime:
  vix_pct_calm: 40
  vix_pct_stress: 80
  rv20_pct_calm: 40
  rv20_pct_stress: 80
  drawdown_calm: 5
  drawdown_stress: 10
  score_calm_max: 0.67
  score_stress_min: 1.33
  weights:
    vix: 0.25
    rv20: 0.25
    drawdown: 0.25
    event: 0.00
    stress_proxy: 0.00
  event_path: config/regime_events_v1.yaml
  stress_proxy_ticker: "^VIX"

structures:
  skew_fade:
    short_put_delta: -0.25
    long_put_delta: -0.10
  fly:
    wing_delta: 0.25
  calendar:
    front_dte_min: 14
    front_dte_max: 30
    back_dte_min: 30
    back_dte_max: 60
  execution_costs:
    transaction_cost_bps: 5.0
    impact_cost_bps: 3.0
    impact_exponent: 1.35
    hedge_turnover_bps: 2.0
    size_tiers: [1.0, 3.0, 5.0]
